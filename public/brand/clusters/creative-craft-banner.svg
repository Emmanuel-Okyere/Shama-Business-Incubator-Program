<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" fill="none" role="img" aria-label="A tailor's bench with patterned cloth, thread, scissors and beads">
  <defs>
    <linearGradient id="cbbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6e8"/><stop offset="1" stop-color="#ffd0b4"/></linearGradient>
    <clipPath id="cbclip"><rect width="1600" height="560"/></clipPath>
  </defs>
  <g clip-path="url(#cbclip)">
    <rect width="1600" height="560" fill="url(#cbbg)"/>
    <circle cx="1420" cy="90" r="200" fill="#db000e" opacity="0.09"/>
    <circle cx="700" cy="520" r="180" fill="#8ab61a" opacity="0.10"/>

    <!-- cloth bolt -->
    <g transform="rotate(-8 820 300)">
      <rect x="700" y="140" width="330" height="250" rx="16" fill="#db000e"/>
      <rect x="700" y="170" width="330" height="18" fill="#f7c948"/>
      <rect x="700" y="216" width="330" height="10" fill="#0f1126"/>
      <rect x="700" y="248" width="330" height="22" fill="#8ab61a"/>
      <rect x="700" y="300" width="330" height="10" fill="#f7c948"/>
      <rect x="700" y="330" width="330" height="18" fill="#0f1126"/>
      <g fill="#fff6e8" opacity="0.9">
        <rect x="742" y="194" width="15" height="15" transform="rotate(45 749 201)"/>
        <rect x="832" y="194" width="15" height="15" transform="rotate(45 839 201)"/>
        <rect x="922" y="194" width="15" height="15" transform="rotate(45 929 201)"/>
        <rect x="786" y="280" width="15" height="15" transform="rotate(45 793 287)"/>
        <rect x="876" y="280" width="15" height="15" transform="rotate(45 883 287)"/>
        <rect x="966" y="280" width="15" height="15" transform="rotate(45 973 287)"/>
      </g>
      <rect x="700" y="140" width="330" height="250" rx="16" fill="none" stroke="#0f1126" stroke-width="5" opacity="0.22"/>
    </g>

    <!-- spool -->
    <g transform="translate(1140 330)">
      <rect x="-28" y="-76" width="56" height="152" rx="9" fill="#0f1126"/>
      <rect x="-42" y="-90" width="84" height="20" rx="7" fill="#587118"/>
      <rect x="-42" y="70" width="84" height="20" rx="7" fill="#587118"/>
      <g stroke="#8ab61a" stroke-width="7" opacity="0.9">
        <path d="M-28 -50 H28"/><path d="M-28 -24 H28"/><path d="M-28 2 H28"/><path d="M-28 28 H28"/><path d="M-28 54 H28"/>
      </g>
    </g>
    <path d="M1168 258 q100 -80 196 -18 t150 -26" stroke="#8ab61a" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- needle -->
    <g transform="rotate(26 1420 190)">
      <rect x="1330" y="184" width="200" height="8" rx="4" fill="#0f1126"/>
      <circle cx="1337" cy="188" r="10" fill="none" stroke="#0f1126" stroke-width="5"/>
    </g>

    <!-- scissors -->
    <g transform="translate(1310 420) rotate(-14)" stroke="#0f1126" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M0 0 L126 -62"/><path d="M0 -62 L126 0"/>
      <circle cx="-16" cy="6" r="19"/><circle cx="-16" cy="-68" r="19"/>
    </g>

    <!-- beads -->
    <g transform="translate(760 452)">
      <path d="M0 0 q110 74 220 0" stroke="#0f1126" stroke-width="3" fill="none" opacity="0.45"/>
      <g fill="#db000e">
        <circle cx="14" cy="14" r="13"/><circle cx="62" cy="42" r="13" fill="#f7c948"/>
        <circle cx="112" cy="52" r="13" fill="#8ab61a"/><circle cx="162" cy="40" r="13" fill="#0f1126"/>
        <circle cx="208" cy="12" r="13"/>
      </g>
    </g>
  </g>
</svg>
