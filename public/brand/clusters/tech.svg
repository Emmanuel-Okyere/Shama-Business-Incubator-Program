<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" role="img" aria-label="A phone showing a rising chart, surrounded by circuitry and connected nodes">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131a4a"/><stop offset="0.6" stop-color="#2b2f8f"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="tscreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1126"/><stop offset="1" stop-color="#1c2150"/>
    </linearGradient>
    <clipPath id="tclip"><rect width="800" height="500"/></clipPath>
  </defs>

  <g clip-path="url(#tclip)">
    <rect width="800" height="500" fill="url(#tbg)"/>
    <circle cx="130" cy="90" r="170" fill="#8ab61a" opacity="0.10"/>

    <!-- circuitry -->
    <g stroke="#8ab61a" stroke-width="3" opacity="0.55" fill="none" stroke-linecap="round">
      <path d="M40 380 H150 V300 H236"/>
      <path d="M40 440 H196 V404"/>
      <path d="M760 150 H660 V226 H586"/>
      <path d="M760 320 H690 V386 H600"/>
      <path d="M120 150 H210 V214"/>
    </g>
    <g fill="#cfe94f">
      <circle cx="40" cy="380" r="7"/><circle cx="236" cy="300" r="7"/>
      <circle cx="40" cy="440" r="7"/><circle cx="196" cy="404" r="7"/>
      <circle cx="760" cy="150" r="7"/><circle cx="586" cy="226" r="7"/>
      <circle cx="760" cy="320" r="7"/><circle cx="600" cy="386" r="7"/>
      <circle cx="120" cy="150" r="7"/><circle cx="210" cy="214" r="7"/>
    </g>

    <!-- phone -->
    <g transform="translate(400 250)">
      <rect x="-104" y="-172" width="208" height="344" rx="30" fill="#0b0e22"/>
      <rect x="-94" y="-162" width="188" height="324" rx="24" fill="url(#tscreen)"/>
      <rect x="-26" y="-152" width="52" height="9" rx="4.5" fill="#4f46e5"/>

      <!-- chart -->
      <g transform="translate(0 24)">
        <g fill="#4f46e5">
          <rect x="-66" y="-6" width="22" height="58" rx="5"/>
          <rect x="-32" y="-34" width="22" height="86" rx="5"/>
          <rect x="2" y="-62" width="22" height="114" rx="5"/>
          <rect x="36" y="-96" width="22" height="148" rx="5" fill="#8ab61a"/>
        </g>
        <path d="M-58 -22 L-22 -50 L12 -76 L46 -112" stroke="#cfe94f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="46" cy="-112" r="9" fill="#cfe94f"/>
      </g>

      <!-- header rows -->
      <g fill="#ffffff" opacity="0.28">
        <rect x="-66" y="-124" width="94" height="12" rx="6"/>
        <rect x="-66" y="-102" width="58" height="10" rx="5"/>
      </g>
      <g fill="#ffffff" opacity="0.16">
        <rect x="-66" y="112" width="132" height="10" rx="5"/>
        <rect x="-66" y="132" width="88" height="10" rx="5"/>
      </g>
    </g>

    <!-- spark -->
    <g transform="translate(596 118)">
      <path d="M0 -42 L11 -11 L42 0 L11 11 L0 42 L-11 11 L-42 0 L-11 -11 Z" fill="#cfe94f"/>
    </g>
    <g transform="translate(196 330) scale(0.5)" opacity="0.8">
      <path d="M0 -42 L11 -11 L42 0 L11 11 L0 42 L-11 11 L-42 0 L-11 -11 Z" fill="#cfe94f"/>
    </g>
  </g>
</svg>
